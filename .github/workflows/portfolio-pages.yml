name: Publish engineering portfolio

on:
  push:
    branches: [main]
    paths:
      - "Website/**"
      - ".github/workflows/portfolio-pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: portfolio-pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Check out source
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Read Pages configuration
        id: pages
        uses: actions/configure-pages@v5

      - name: Build and validate portfolio
        working-directory: Website
        env:
          PORTFOLIO_ORIGIN: ${{ steps.pages.outputs.origin }}
          PORTFOLIO_BASE_PATH: ${{ steps.pages.outputs.base_path }}
        run: |
          python build_portfolio.py
          python tools/validate_site.py

      - name: Upload website files
        uses: actions/upload-pages-artifact@v4
        with:
          path: Website/dist

      - name: Publish to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
